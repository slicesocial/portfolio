media:
  input: media
  output: /media

content:
  - name: clients
    label: Clients
    type: file
    path: content/clients.json
    format: json
    fields:
      - name: clients
        label: Clients (top of the list shows first)
        type: object
        list: true
        fields:
          - { name: name, label: Client name, type: string, required: true }
          - { name: category, label: Category (e.g. culture, brand), type: string }
          - { name: instagram, label: Instagram link, type: string }
          - { name: what_i_did, label: What I did, type: text }
          - { name: process, label: The process, type: text }
          - { name: results, label: Results, type: text }
          - { name: feedback, label: Feedback quote (leave empty to hide), type: text }
          - name: videos
            label: Videos (9:16)
            type: object
            list: true
            fields:
              - { name: video, label: Video file (.mp4), type: file }
              - { name: poster, label: Cover image (optional), type: image }
              - { name: title, label: Title (optional), type: string }

  - name: about
    label: About me
    type: file
    path: content/about.json
    format: json
    fields:
      - { name: heading, label: Heading, type: string }
      - { name: photo, label: Square photo, type: image }
      - { name: bio, label: Bio (leave a blank line between paragraphs), type: text }